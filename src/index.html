<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Today</title>
</head>

<body>
    <header>
        <!-- The Button you click -->
        <button type="button" class="hamburger" id="hamburger-btn">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </button>

        <!-- The Navigation Menu -->
        <nav class="nav-menu" id="nav-menu">
            <span id="nav-menu__close">BACK</span>
            <span id="nav-menu__heading">LATEST LOCATIONS</span>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <div class="search" id="search">
            <form action="" class="search-location-from">
                <div class="form-group search-location__container">
                    <input id="search-location__input" required type="text" placeholder="Search City or Zip Code">
                    <!-- REPLACE WITH ICON -->
                    <button id="search-location__btn" type="submit">S</button>
                </div>
            </form>
            <div class="search__location-refresh">
                <img src="./Assets/refresh.svg" alt="">
            </div>
        </div>

        <div class="location" id="location">
            <span id="location__name">Toronto</span>
            <!-- Add date -->
        </div>

        <div class="weather-overview" id="weather-overview">
            <div class="weather-overview__temperature">
                <div id="temperature-amount">
                    <span id="value">15</span>
                </div>
                <div id="temperature-details">
                    <span id="metric">
                        <span id="celsius" class="selected">&deg;C</span>|<span id="fahrenheit">&deg;F</span>
                    </span>
                    <span id="description">
                        Partly cloudy
                    </span>
                </div>
            </div>
            <div class="weather-overview__extra-info">
                <div id="weather-icon">
                    <img src="./Assets/sun.svg" style="width: 200px; height: auto;" alt="">
                </div>
                <div id="weather-extra-details">
                    <span id="weather-feels-like">
                        <img src="./Assets/air_conditions/Temperature.svg" alt="">
                        <span class="text">Feels like:</span>
                        <span id="weather-feels-like__value" class="value">23°</span>
                    </span>
                    <span class="vertical-splitor">&#10072;</span>
                    <span id="weather-precipitation">
                        <img src="./Assets/air_conditions/Rain.svg" alt="">
                        <span class="text">Precipitation:</span>
                        <span id="weather-precipitation__value" class="value"></span>
                    </span>
                    <span class="vertical-splitor">&#10072;</span>
                    <span id="weather-wind">
                        <img src="./Assets/air_conditions/Wind.svg" alt="">
                        <span class="text">Wind:</span>
                        <span id="weather-wind__value" class="value"></span>
                    </span>
                </div>
            </div>
        </div>

        <div class="weather-forecast">
            <div id="weather-forecast__heading">
                7-day Forecast
            </div>

            <div class="weather-forecast__container" id="weather-forecast__container">
                <div class="weather-forecast__card">
                    <span class="weather-forecast__text">Monday</span>
                    <img class="weather-forecast__icon" src="./Assets/weather_icons/cloudy.svg" alt="">
                    <span class="weather-forecast__temperature">
                        <span id="max">23°</span>&#8210;<span id="min">12°</span>
                    </span>
                    <span class="weather-forecast__description">Overcast clouds</span>
                    <span class="weather-forecast__precipitation">
                        <img src="./Assets/air_conditions/Rain.svg" alt="">
                        <span id="weather-precipitation__value value">12%</span>
                    </span>
                </div>

                <div class="weather-forecast__card">
                    <span class="weather-forecast__text">Tuesday</span>
                    <img class="weather-forecast__icon" src="./Assets/weather_icons/cloudy.svg" alt="">
                    <span class="weather-forecast__temperature">
                        <span id="max">23°</span>&#8210;<span id="min">12°</span>
                    </span>
                    <span class="weather-forecast__description">Overcast clouds</span>
                    <span class="weather-forecast__precipitation">
                        <img src="./Assets/air_conditions/Rain.svg" alt="">
                        <span id="weather-precipitation__value value">50%</span>
                    </span>
                </div>

                <div class="weather-forecast__card"></div>
                <div class="weather-forecast__card"></div>
                <div class="weather-forecast__card"></div>
                <div class="weather-forecast__card"></div>
                <div class="weather-forecast__card"></div>
            </div>
        </div>

        <div class="hourly-forecast" id="hourly-forecast">

            <div id="hourly-forecast__header">
                <span id="hourly-forecast__text">
                    Hourly Forecast
                </span>

                <select name="days" id="">
                    <option value="Tuesday">Tuesday</option>
                </select>

            </div>
            <div id="hourly-forecast__body">
                <div class="hourly-forecast__card">
                    <!-- <div class="half"> -->
                    <span class="hour">18:00</span>
                    <span class="icon">
                        <img src="./Assets/weather_icons/partlycloudy.svg" alt="">
                        <span id="description">Partly cloudy</span>
                    </span>
                    <span class="temperature">
                        <span id="max">23°</span>&#47;<span id="min">12°</span>
                    </span>
                    <!-- </div> -->
                    <span id="feels-like">
                        <img src="./Assets/air_conditions/Temperature.svg" alt="">
                        <span id="feels-like__value value">23°</span>
                    </span>
                    <!--  -->
                    <span id="wind">
                        <img src="./Assets/air_conditions/Wind.svg" alt="">
                        <span id="weather-wind__value value">10km/h</span>
                    </span>
                    <!--  -->
                    <span id="precipitation">
                        <img src="./Assets/air_conditions/Rain.svg" alt="">
                        <span id="precipitation__value value">40%</span>
                    </span>

                </div>
            </div>

        </div>

    </main>

    <footer>
        <h1>footer</h1>
    </footer>
</body>

</html>
